services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cloudops
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudops"]
      interval: 5s
      timeout: 5s
      retries: 5

  cloudops:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudops-unified:latest
    container_name: cloudops-unified
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - PORT=3001
      - DATABASE_URL=postgres://postgres@postgres:5432/cloudops
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
