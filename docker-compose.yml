# Phase 0 groundwork: redis added for Phase 1.2 (gateway session registry) and 1.3 (STS credential cache).
# No application code is wired to Redis yet.
services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cloudops
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  defenseclaw:
    build:
      context: .
      dockerfile: Dockerfile.defenseclaw
    image: defenseclaw-sidecar:latest
    container_name: cloudops-defenseclaw
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  cloudops:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudops-unified:latest
    container_name: cloudops-unified
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      defenseclaw:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - PORT=3001
      - DATABASE_URL=postgres://postgres@postgres:5432/cloudops
      - DEFENSECLAW_ENDPOINT=http://defenseclaw:8080/v1/evaluate
      - HERMES_URL=http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:

