name: CI

on:
  push:
    branches: [main, v3, phase-0-groundwork, "feat/**"]
  pull_request:
    branches: [main, v3, phase-0-groundwork, "feat/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-parity-gate:
    name: Policy Parity Gate (Suite C)
    runs-on: ubuntu-latest
    env:
      DEFENSECLAW_GATEWAY_TOKEN: ${{ secrets.DEFENSECLAW_GATEWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Pinned OPA CLI v1.15.2
        run: |
          set -euo pipefail
          curl -sL https://github.com/open-policy-agent/opa/releases/download/v1.15.2/opa_linux_amd64_static -o /usr/local/bin/opa
          chmod +x /usr/local/bin/opa
          opa version

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Compile Rego Policy to WebAssembly
        run: ./scripts/build-rego-wasm.sh

      - name: Start DefenseClaw Sidecar
        run: |
          docker compose build defenseclaw
          docker compose up defenseclaw -d
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8080/health; then
              echo "DefenseClaw is healthy"
              break
            fi
            echo "Waiting for DefenseClaw..."
            sleep 1
          done

      - name: Enforce Policy Parity (Suites A, B, C)
        run: npx vitest run tests/unit/policy_parity.test.ts

      - name: Run Security Core Test Suite
        run: |
          npx vitest run tests/unit/defenseclaw_spike.test.ts \
            tests/unit/audit_chain.test.ts \
            tests/unit/approval_lifecycle.test.ts \
            tests/unit/approval_idempotency.test.ts \
            tests/unit/approval_signatures.test.ts \
            tests/unit/gateway_protocol.test.ts

  build-and-test:
    name: Monorepo Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Pinned OPA CLI v1.15.2
        run: |
          curl -sL https://github.com/open-policy-agent/opa/releases/download/v1.15.2/opa_linux_amd64_static -o /usr/local/bin/opa
          chmod +x /usr/local/bin/opa

      - name: Install Dependencies
        run: npm ci

      - name: Compile Rego Policy to WebAssembly
        run: ./scripts/build-rego-wasm.sh

      - name: Build Monorepo
        run: npm run build

      - name: Run Prompt Test
        run: npx vitest run tests/unit/prompt.test.ts
